[package]
name = "test-qemu-arm-virt-rs-webserver"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "baremetal"
path = "main.rs"

[dependencies]
aarch64-cpu = { version = "12.0.0", features = ["critical-section-single-core"] }
critical-section = "1.2.0"
embassy-executor = "0.10.0"
embassy-net = { version = "0.9.1", features = ["tcp", "dhcpv4", "medium-ethernet", "proto-ipv4"] }
embassy-net-driver = "0.2.0"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-time-driver = "0.2.2"
embassy-time-queue-utils = "0.3.2"
embedded-io-async = "0.7.0"
heapless = "0.9.3"
static_cell = "2.1.1"
